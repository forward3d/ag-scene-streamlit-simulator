name: Python Quality Gates

on:
  pull_request:
    paths:
      - 'code/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint with Ruff
        run: uv run ruff check code/ tests/

      - name: Test with Pytest
        run: uv run pytest tests/