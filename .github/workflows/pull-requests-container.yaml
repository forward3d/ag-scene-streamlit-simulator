name: container

on:
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read
  packages: read

env:
  HARBOR_HOSTNAME: ${{ vars.HARBOR_HOSTNAME }}
  HARBOR_ACCOUNT_USERNAME: ${{ vars.HARBOR_ACCOUNT_USERNAME }}
  HARBOR_ACCOUNT_PASSWORD: ${{ secrets.HARBOR_ACCOUNT_PASSWORD }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check if Dockerfile exists and is not empty
        id: check-dockerfile
        run: |
          if [ -s Dockerfile ]; then
            echo "exists=true" >> $GITHUB_ENV
          else
            echo "exists=false" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        if: env.exists == 'true'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to the Container registry
        if: env.exists == 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.HARBOR_HOSTNAME }}
          username: ${{ env.HARBOR_ACCOUNT_USERNAME }}
          password: ${{ env.HARBOR_ACCOUNT_PASSWORD }}

      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        if: env.exists == 'true'
        with:
          dockerfile: Dockerfile
